services:
  db:
    image: postgres:15-alpine
    container_name: facial_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-facial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facial_pass}
      POSTGRES_DB: ${POSTGRES_DB:-facial_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-facial_user}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - facial_network

  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: facial_api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-facial_user}:${POSTGRES_PASSWORD:-facial_pass}@db:5432/${POSTGRES_DB:-facial_db}
      POSTGRES_HOST: db
      POSTGRES_USER: ${POSTGRES_USER:-facial_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-facial_pass}
      POSTGRES_DB: ${POSTGRES_DB:-facial_db}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/app/app
      - ./models:/app/models
    networks:
      - facial_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: facial_frontend
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    networks:
      - facial_network
    command: streamlit run app.py --server.address 0.0.0.0 --server.port 8501

volumes:
  postgres_data:

networks:
  facial_network:
    driver: bridge
